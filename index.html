<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密花园 · Emily's Secret Garden</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="controls">
    <button class="btn active view" id="btnGrid" onclick="setView('grid')">🪴</button>
    <button class="btn" id="btnLoc" onclick="setView('loc')">📍</button>
    <button class="btn" id="btnToday" onclick="setView('today')">📋</button>
    <span class="divider-v"></span>
    <button class="btn active light" id="btnLight" onclick="setSortBy('light')">☀️</button>
    <button class="btn" id="btnWater" onclick="setSortBy('water')">💧</button>
    <span class="divider-v"></span>
    <span class="season-tag" id="seasonTag"></span>
</div>

<main>
    <div id="grid"></div>
    <div id="locationView"></div>
    <div id="dashboard"></div>
    <div id="chemView"></div>
    <div class="app-settings">
        <button id="btnChemFooter" onclick="setView('chem')"></button>
        <span class="app-settings-dot">·</span>
        <button id="btnLangFooter" onclick="toggleLang()"></button>
        <span class="app-settings-dot">·</span>
        <button id="btnWaterToggle" onclick="toggleWatering()"></button>
    </div>
</main>

<div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div>
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-subtitle" id="modalSubtitle"></div>
            </div>
            <div class="modal-header-actions">
                <button class="btn lang" id="modalLangBtn" onclick="toggleLang()">EN</button>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <img id="lbImg" alt="" onclick="event.stopPropagation()">
    <div class="lb-meta" id="lbMeta"></div>
    <div class="lb-actions" onclick="event.stopPropagation()">
        <button class="lb-btn lb-del" id="lbDelBtn"></button>
        <button class="lb-btn lb-close" id="lbCloseBtn" onclick="closeLightbox()"></button>
    </div>
</div>

<script src="js/data-reference.js"></script>
<script src="js/data-plants.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/store-water.js"></script>
<script src="js/store-photos-local.js"></script>
<script src="js/store-photos-github.js"></script>
<script src="js/photos-ui.js"></script>
<script src="js/render-water.js"></script>
<script src="js/render-grid.js"></script>
<script src="js/render-location.js"></script>
<script src="js/render-chem.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
